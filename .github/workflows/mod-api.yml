name: PandaClient mod API

on:
  push:
    paths: ['mod/tools/**', '.github/workflows/mod-api.yml']
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Set up Minecraft
        run: gradle -p mod help --no-daemon -q > /dev/null 2>&1 || true
      - name: API signatures
        run: bash mod/tools/print-api.sh ${{ matrix.group }}
