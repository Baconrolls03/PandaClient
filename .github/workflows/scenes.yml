name: Lobby scenes

# Renders the lobby's built-in places in a real generated world and commits them to the branch.
on:
  push:
    branches-ignore: [main]
    paths: ['mod/tools/scenes.sh', '.github/workflows/scenes.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Render the places
        timeout-minutes: 50
        run: |
          sudo apt-get install -y -qq xvfb imagemagick mesa-utils libgl1-mesa-dri > /dev/null
          bash mod/tools/scenes.sh
          for f in shots/*.jpg; do [ -f "$f" ] && { echo "===== SHOT $f"; base64 -w 0 "$f"; echo; }; done; true
      - name: Commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod/src/main/resources/assets/pandaclient/lobby
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Lobby: built-in places rendered in a generated world"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
