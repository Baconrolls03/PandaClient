name: PandaClient mod

on:
  push:
    paths: ['mod/**', '.github/workflows/mod.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Fabric versions
        run: |
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -oE '<(latest|release)>[^<]+' || true
          curl -s https://meta.fabricmc.net/v2/versions/loader/1.21.11 | head -c 300; echo
          curl -s "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.21.11%22%5D" | grep -oE '"version_number":"[^"]+"' | head -3
          gradle --version | head -3
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p mod build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show compile errors
        if: steps.build.outcome == 'failure'
        run: |
          grep -E "error:|What went wrong" -A12 build.log | head -250 || true
      # Prints the public signatures of the Minecraft / Fabric API classes the mod uses (no source code),
      # so the mod can be written against the exact 1.21.11 API.
      - name: API signatures
        if: always()
        run: bash mod/tools/print-api.sh || true
      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: pandaclient-mod
          path: mod/build/libs/pandaclient-*.jar
