name: PandaClient mod

on:
  push:
    paths: ['mod/**', '.github/workflows/mod.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p mod build --no-daemon 2>&1 | tee build.log
      - name: Run the game (smoke test)
        if: steps.build.outcome == 'success'
        timeout-minutes: 20
        run: |
          sudo apt-get install -y -qq xvfb imagemagick mesa-utils libgl1-mesa-dri > /dev/null
          bash mod/tools/smoke.sh
          for f in game.log world.log; do
            echo "===== $f"
            grep -E "PandaClient|Mixin apply|mixin audit|Exception|Crash|crash|exit |Caused by|at com\.pandaclient" $f | grep -vE "DEBUG|Force-loading|flite|Narrator|OpenAL|Realms|SignedJWT" | head -60 || true
          done
          for f in shots/*.jpg; do [ -f "$f" ] && { echo "===== SHOT $f"; base64 -w 0 "$f"; echo; }; done
          grep -q "\[PandaClient CI\] mixins OK" game.log
          grep -q "\[PandaClient CI\] mixins OK" world.log
          ! grep -q "Exception in\|---- Minecraft Crash Report" game.log world.log
      - name: Summary
        if: always()
        run: |
          echo "----- versions"
          gradle --version | grep -E "^Gradle" || true
          curl -s https://meta.fabricmc.net/v2/versions/loader/1.21.11 | grep -oE '"version":"[^"]+"' | head -2 || true
          curl -s "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.21.11%22%5D" | grep -oE '"version_number":"[^"]+"' | head -2 || true
          echo "----- errors"
          grep -E "error:|What went wrong" -A12 build.log | head -250 || true
      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: pandaclient-mod
          path: mod/build/libs/pandaclient-*.jar

  # The same mod built for older Minecraft versions (see mod/versions/).
  other-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.10', '1.21.9']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build for ${{ matrix.mc }}
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p mod build -Pmc=${{ matrix.mc }} --no-daemon 2>&1 | tee build.log
      - name: Errors
        if: steps.build.outcome == 'failure'
        run: |
          grep -E "error:|What went wrong" -A6 build.log | grep -v "^--$" | head -150
          exit 1
      - name: Start the game on ${{ matrix.mc }} (menus + every hook checked)
        timeout-minutes: 12
        env:
          SMOKE_MC: ${{ matrix.mc }}
          SMOKE_TITLE_ONLY: '1'
        run: |
          sudo apt-get install -y -qq xvfb imagemagick mesa-utils libgl1-mesa-dri > /dev/null
          bash mod/tools/smoke.sh
          grep -E "PandaClient|Mixin apply|mixin audit|Exception|Crash|exit |Caused by" game.log | grep -vE "DEBUG|Force-loading|flite|Narrator|OpenAL|Realms|SignedJWT" | head -40 || true
          grep -q "\\[PandaClient CI\\] mixins OK" game.log
      - uses: actions/upload-artifact@v4
        with:
          name: pandaclient-mod-${{ matrix.mc }}
          path: mod/build/libs/pandaclient-*.jar
