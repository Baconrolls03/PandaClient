name: PandaClient mod

on:
  push:
    paths: ['mod/**', '.github/workflows/mod.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p mod build --no-daemon 2>&1 | tee build.log
      - name: Run the game (smoke test)
        if: steps.build.outcome == 'success'
        timeout-minutes: 15
        run: |
          sudo apt-get install -y -qq xvfb imagemagick mesa-utils libgl1-mesa-dri > /dev/null
          bash mod/tools/smoke.sh
          grep -E "PandaClient|Mixin|mixin|Exception|Error|Crash|exit |Loading Minecraft|Backend library|OpenGL" game.log | grep -v "DEBUG" | head -80 || true
          echo "----- last lines"; tail -30 game.log
          for f in shots/*.jpg; do echo "===== $f"; base64 -w 0 "$f"; echo; done
          grep -q "\[PandaClient CI\] mixins OK" game.log
      - name: Summary
        if: always()
        run: |
          echo "----- versions"
          gradle --version | grep -E "^Gradle" || true
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -oE '<version>1\.1[0-9][^<]*' | grep -v SNAPSHOT | tr '\n' ' ' || true; echo
          curl -s https://meta.fabricmc.net/v2/versions/loader/1.21.11 | grep -oE '"version":"[^"]+"' | head -2 || true
          curl -s "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.21.11%22%5D" | grep -oE '"version_number":"[^"]+"' | head -2 || true
          echo "----- errors"
          grep -E "error:|What went wrong" -A12 build.log | head -250 || true
      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: pandaclient-mod
          path: mod/build/libs/pandaclient-*.jar
