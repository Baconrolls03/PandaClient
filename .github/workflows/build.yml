name: Build PandaClient

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:launch

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pushes to main publish a GitHub Release (once per version); the app's updater picks it up.
      - name: Decide whether to publish a release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${{ github.ref }}" = "refs/heads/main" ] && ! gh release view "v$version" > /dev/null 2>&1; then
            echo "publish=always" >> "$GITHUB_OUTPUT"
            echo "Publishing PandaClient v$version"
          else
            echo "publish=never" >> "$GITHUB_OUTPUT"
            echo "Not publishing (branch build, or v$version already released)"
          fi
      - run: npx electron-vite build && npx electron-builder --win --publish ${{ steps.release.outputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: PandaClient-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
