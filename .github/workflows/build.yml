name: Build PandaClient

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:launch

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build the PandaClient Fabric mod; the installer ships it and adds it to 1.21.11 instances.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build the PandaClient mod
        shell: bash
        run: |
          gradle -p mod build --no-daemon -q
          mkdir -p build/mods
          cp "$(ls mod/build/libs/pandaclient-*.jar | grep -v sources | head -1)" build/mods/pandaclient.jar
          cp build/mods/pandaclient.jar build/pandaclient-mod.jar
          ls -la build/mods
      - run: npx electron-vite build && npx electron-builder --win --publish never
      # Pushes to main publish a GitHub Release (once per version); the app's updater reads latest.yml from it.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; bump the version in package.json to publish a new one."
            exit 0
          fi
          gh release create "v$version" \
            "release/PandaClient-Setup-$version.exe" \
            "release/PandaClient-Setup-$version.exe.blockmap" \
            release/latest.yml \
          build/pandaclient-mod.jar \
            --target "$GITHUB_SHA" \
            --title "PandaClient $version" \
            --notes "Download **PandaClient-Setup-$version.exe** below and run it. Already have PandaClient? It updates itself."
      - uses: actions/upload-artifact@v4
        with:
          name: PandaClient-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
