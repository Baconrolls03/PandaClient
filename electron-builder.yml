appId: com.pandaclient.launcher
productName: PandaClient
copyright: PandaClient. Not affiliated with Mojang or Microsoft.
directories:
  output: release
  buildResources: assets
files:
  - out/**
  - assets/**
  - package.json
asarUnpack: []
# The PandaClient Fabric mod (built by CI into build/mods), added to 1.21.11 instances at launch.
extraResources:
  - from: build/mods
    to: mods
    filter: ['*.jar']
icon: assets/icon.png
artifactName: ${productName}-Setup-${version}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PandaClient

mac:
  target: dmg
  category: public.app-category.games
linux:
  target: AppImage
  category: Game

# Releases on GitHub feed the in-app updater (electron-updater reads latest.yml from the release).
publish:
  provider: github
  owner: Baconrolls03
  repo: PandaClient
  releaseType: release
